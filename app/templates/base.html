<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Farros Media Bot Admin{% endblock %}</title>
    <meta name="csrf-token" content="{{ csrf_token }}">
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body hx-headers='{"X-CSRF-Token": "{{ csrf_token }}"}'>
    <div class="layout-container">
        {% if admin %}
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-title">Farros Media Bot</div>
                <div class="text-sm text-muted mt-4">PROD ENVIRONMENT</div>
            </div>
            <ul class="nav-list">
                <li class="nav-item">
                    <a href="/admin" class="nav-link {% if request.url.path == '/admin' or request.url.path == '/admin/' %}active{% endif %}">Dashboard</a>
                </li>
                <li class="nav-item">
                    <a href="/admin/allowed-numbers" class="nav-link {% if '/allowed-numbers' in request.url.path or '/numbers' in request.url.path %}active{% endif %}">Nomor Diizinkan</a>
                </li>
                <li class="nav-item">
                    <a href="/admin/unmapped-lids" class="nav-link {% if '/unmapped-lids' in request.url.path %}active{% endif %}">LID Belum Dipetakan</a>
                </li>
                <li class="nav-item">
                    <a href="/admin/history" class="nav-link {% if '/history' in request.url.path %}active{% endif %}">Riwayat Job</a>
                </li>
                <li class="nav-item">
                    <a href="/admin/settings" class="nav-link {% if '/settings' in request.url.path %}active{% endif %}">Pengaturan</a>
                </li>
            </ul>
            <div style="padding: 1.5rem; border-top: 1px solid var(--border-color);">
                <div class="text-sm mb-4">👤 {{ admin.username }}</div>
                <form action="/admin/logout" method="post">
                    <input type="hidden" name="_csrf_token" value="{{ csrf_token }}">
                    <button type="submit" class="btn btn-secondary" style="width: 100%;">Logout</button>
                </form>
            </div>
        </aside>
        {% endif %}

        <main class="main-content">
            {% block content %}{% endblock %}
        </main>
    </div>

    <script src="/static/main.js"></script>
</body>
</html>
