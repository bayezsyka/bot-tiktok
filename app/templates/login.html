{% extends "base.html" %}

{% block title %}Login - Farros Media Bot{% endblock %}

{% block content %}
<div style="display: flex; min-height: 100vh; align-items: center; justify-content: center; background-color: var(--page-bg); position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 100;">
    <div class="card" style="width: 100%; max-width: 400px; padding: 2.5rem; box-shadow: var(--shadow-lg); border-radius: var(--radius-lg);">
        <div style="text-align: center; margin-bottom: 2rem;">
            <div style="font-weight: 800; font-size: 1.5rem; color: var(--color-primary); letter-spacing: -0.03em; margin-bottom: 0.25rem;">Farros Media Bot</div>
            <p class="text-muted" style="font-size: 0.875rem;">Admin Portal Login</p>
        </div>

        {% if error %}
        <div class="badge badge-danger" style="display: block; width: 100%; padding: 0.75rem 1rem; border-radius: var(--radius-md); margin-bottom: 1.5rem; font-size: 0.875rem; text-transform: none; letter-spacing: normal; text-align: left; line-height: 1.4;">
            {{ error }}
        </div>
        {% endif %}

        <!-- Sangkolo ID Single Sign-On Button -->
        <div style="margin-bottom: 1.5rem;">
            <a href="/auth/sso/redirect" class="btn btn-primary" style="display: flex; align-items: center; justify-content: center; gap: 0.5rem; width: 100%; padding: 0.75rem; font-size: 0.9375rem; text-decoration: none; font-weight: 600;">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
                    <polyline points="10 17 15 12 10 7"/>
                    <line x1="15" y1="12" x2="3" y2="12"/>
                </svg>
                <span>Masuk dengan Sangkolo ID</span>
            </a>
            <div style="display: flex; align-items: center; margin: 1.25rem 0; text-align: center;">
                <div style="flex: 1; border-bottom: 1px solid var(--border-color, #e2e8f0);"></div>
                <span style="padding: 0 0.75rem; font-size: 0.75rem; text-transform: uppercase; color: var(--text-muted, #64748b); font-weight: 600;">atau akun manual</span>
                <div style="flex: 1; border-bottom: 1px solid var(--border-color, #e2e8f0);"></div>
            </div>
        </div>

        <form action="/admin/login" method="post">
            <input type="hidden" name="_csrf_token" value="{{ csrf_token }}">
            <div class="form-group">
                <label for="username" class="form-label">Username</label>
                <input type="text" id="username" name="username" class="form-control" required autocomplete="username" placeholder="Masukkan username admin">
            </div>
            <div class="form-group" style="margin-bottom: 2rem;">
                <label for="password" class="form-label">Password</label>
                <input type="password" id="password" name="password" class="form-control" required autocomplete="current-password" placeholder="Masukkan password">
            </div>
            <button type="submit" class="btn btn-secondary" style="width: 100%; padding: 0.75rem; font-size: 0.9375rem;">Masuk Akun Manual</button>
        </form>
    </div>
</div>
{% endblock %}
