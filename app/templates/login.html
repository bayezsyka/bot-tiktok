{% extends "base.html" %}

{% block title %}Login - Farros Media Bot{% endblock %}

{% block content %}
<div class="auth-portal">
    <div class="auth-card">
        <div class="auth-heading">
            <div class="auth-mark">TK</div>
            <span class="auth-sso-badge">SSO Terhubung</span>
            <h1>Farros Media Bot</h1>
        </div>

        {% if error %}
        <div class="badge badge-danger" style="display: block; width: 100%; padding: 0.75rem 1rem; border-radius: var(--radius-md); margin-bottom: 1.5rem; font-size: 0.875rem; text-transform: none; letter-spacing: normal; text-align: left; line-height: 1.4;">
            {{ error }}
        </div>
        {% endif %}

        <!-- Sangkolo ID Single Sign-On Button -->
        <div style="margin-bottom: 1.5rem;">
            <a href="/auth/sso/redirect" class="auth-sso-button">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
                    <polyline points="10 17 15 12 10 7"/>
                    <line x1="15" y1="12" x2="3" y2="12"/>
                </svg>
                <span>Masuk dengan Sangkolo ID</span>
            </a>
            <div style="display: flex; align-items: center; margin: 1.25rem 0; text-align: center;">
                <div style="flex: 1; border-bottom: 1px solid var(--border-color, #e2e8f0);"></div>
                <span class="auth-separator-label">atau masuk dengan kredensial</span>
                <div style="flex: 1; border-bottom: 1px solid var(--border-color, #e2e8f0);"></div>
            </div>
        </div>

        <form action="/admin/login" method="post">
            <input type="hidden" name="_csrf_token" value="{{ csrf_token }}">
            <div class="form-group">
                <label for="username" class="form-label">Username</label>
                <input type="text" id="username" name="username" class="form-control" required autocomplete="username" placeholder="Masukkan username admin">
            </div>
            <div class="form-group" style="margin-bottom: 2rem;">
                <label for="password" class="form-label">Password</label>
                <input type="password" id="password" name="password" class="form-control" required autocomplete="current-password" placeholder="Masukkan password">
            </div>
            <button type="submit" class="btn btn-secondary auth-local-button">Masuk Akun Manual</button>
        </form>
    </div>
</div>
{% endblock %}
